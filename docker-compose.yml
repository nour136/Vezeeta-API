
services:
  vezeeta.api:
    build:
      context: .
      dockerfile: Vezeeta.API/Dockerfile
    container_name: vezeeta-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__VezeetaDB=Server=db;Database=Vezzeta;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      - JWT__Key=${JWT_KEY}
      - JWT__Issuer=${JWT_ISSUER:-SecureApi}
      - JWT__Audience=${JWT_AUDIENCE:-SecureApiUser}
      - ADMIN__EMAIL=${ADMIN_EMAIL}
      - ADMIN__PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vezeeta-network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vezeeta-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - vezeeta-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - vezeeta-network

volumes:
  vezeeta-sql-data:

networks:
  vezeeta-network:
    driver: bridge
